<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Details — ParkFinder</title>
  <meta name="description" content="View detailed information, availability, reviews and pricing for this parking spot." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2300c3ff'/><text y='.9em' font-size='70' font-weight='900' font-family='Inter,sans-serif' fill='white' x='18'>P</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/details.css" />
</head>
<body>

<nav class="navbar" role="navigation">
  <a href="index.html" class="navbar-brand">
    <div class="brand-icon">P</div>
    <span class="brand-text">ParkFinder</span>
  </a>
  <ul class="navbar-nav">
    <li><a href="index.html">Map</a></li>
    <li><a href="parking-list.html">Parking</a></li>
    <li><a href="favourites.html">Favourites</a></li>
  </ul>
  <div class="navbar-actions">
    <button class="btn-icon theme-btn" id="theme-toggle" title="Toggle theme">
      <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <div id="nav-auth-actions"></div>
    <div id="nav-avatar-wrap" style="display:none;position:relative;">
      <div class="nav-avatar">U</div>
      <div class="nav-dropdown" id="nav-dropdown"></div>
    </div>
  </div>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>
<div class="mobile-nav" id="mobile-nav">
  <a href="index.html">Map</a>
  <a href="parking-list.html">Parking</a>
  <a href="favourites.html">Favourites</a>
  <a href="login.html">Login</a>
</div>

<div class="details-page">
  <!-- Hero Map -->
  <div class="details-hero">
    <button class="details-back" onclick="history.back()">&larr; Back</button>
    <div id="detail-mini-map" class="details-hero-map"></div>
    <div class="details-hero-overlay"></div>
  </div>

  <!-- Content -->
  <div class="details-content" id="details-content">
    <div style="text-align:center;padding:60px 0;color:var(--text-2)">
      <div class="spinner"></div>
      <p style="margin-top:12px">Loading parking details&hellip;</p>
    </div>
  </div>
</div>

<!-- Book Now Modal -->
<div class="modal-overlay" id="book-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Book Parking</span>
      <button class="modal-close" data-modal-close="book-modal">&times;</button>
    </div>
    <div id="book-modal-content"></div>
  </div>
</div>

<!-- Success Modal -->
<div class="modal-overlay" id="success-modal">
  <div class="modal" style="text-align:center">
    <div class="success-checkmark">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <circle cx="28" cy="28" r="28" fill="rgba(34,197,94,0.15)"/>
        <circle cx="28" cy="28" r="22" stroke="#22c55e" stroke-width="2"/>
        <path d="M18 28l7 7 13-13" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 style="font-size:1.4rem;margin-bottom:8px;">Booking Confirmed!</h2>
    <p style="color:var(--text-2);margin-bottom:20px;">Your parking spot has been reserved. Check your email for confirmation.</p>
    <div id="booking-ref" style="background:var(--bg-hover);border-radius:var(--r-md);padding:14px;margin-bottom:20px;font-family:monospace;font-size:1.1rem;font-weight:700;color:var(--accent)"></div>
    <button class="btn btn-primary w-full" onclick="closeModal('success-modal');closeModal('book-modal');">Done</button>
  </div>
</div>

<footer class="footer">
  <p>&copy; 2026 ParkFinder &middot; <a href="index.html">Map View</a> &middot; <a href="parking-list.html">Browse All</a></p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/map.js"></script>
<script src="js/details.js"></script>
</body>
</html>
